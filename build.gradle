import com.github.benmanes.gradle.versions.updates.DependencyUpdatesTask

buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:${sonarPluginVersion}"
        classpath "com.github.ben-manes:gradle-versions-plugin:${benManesVersionsPluginVersion}"
    }
}

apply plugin: 'java'
apply plugin: 'application'
apply plugin: 'jacoco'
apply plugin: 'org.sonarqube'
apply plugin: 'com.github.ben-manes.versions'

group = 'de.zettsystems'
version = appVersion

repositories {
    mavenCentral()
}

dependencies {
    implementation "com.google.zxing:core:${zxingVersion}"
    implementation "com.google.zxing:javase:${zxingVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"

    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// The version shown in the window title (AppVersion)
processResources {
    def appVersion = project.version.toString()
    inputs.property('appVersion', appVersion)
    filesMatching('**/version.properties') {
        expand(version: appVersion)
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = jacocoVersion
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'MichaelZett_qrcode-creator'
        property 'sonar.organization', 'michaelzett'
        property 'sonar.host.url', 'https://sonarcloud.io'
        // The Swing UI cannot be tested headless
        property 'sonar.coverage.exclusions', '**/QrCreatorApp.java'
    }
}

// Small, self-contained package per operating system: jpackage (part of the JDK) bundles
// the application with a runtime that jlink has reduced to java.desktop.
// jpackage only builds for the operating system it runs on -> CI matrix.
tasks.register('appImage', Exec) {
    group = 'distribution'
    description = 'Creates a self-contained app image (with a minimal JRE) for the current operating system'
    dependsOn jar

    def inputDir = layout.buildDirectory.dir('jpackage-input')
    def outputDir = layout.buildDirectory.dir('app-image')

    doFirst {
        delete inputDir, outputDir
        copy {
            from jar
            from configurations.runtimeClasspath
            into inputDir
        }
    }

    def jpackageArgs = [
            'jpackage',
            '--type', 'app-image',
            '--name', 'QR-Creator',
            '--app-version', project.version.toString().replace('-SNAPSHOT', ''),
            '--input', inputDir.get().asFile.path,
            '--main-jar', jar.archiveFileName.get(),
            '--main-class', application.mainClass.get(),
            '--dest', outputDir.get().asFile.path,
            '--add-modules', 'java.desktop',
            '--jlink-options', '--strip-debug --no-header-files --no-man-pages --compress zip-9'
    ]
    commandLine jpackageArgs
}

application {
    mainClass = 'de.zettsystems.qrcreator.QrCreatorMain'
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { keyword ->
        version?.toUpperCase()?.contains(keyword)
    }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

def majorVersion = { String version ->
    def matcher = (version ?: '') =~ /(\d+)/
    matcher.find() ? matcher.group(1).toInteger() : null
}

tasks.withType(DependencyUpdatesTask).configureEach { task ->
    boolean minorPatchOnly = project.hasProperty('dependencyUpdates.minorPatchOnly') &&
            project.property('dependencyUpdates.minorPatchOnly').toString().toBoolean()

    task.checkForGradleUpdate = true
    task.outputFormatter = 'plain'

    task.rejectVersionIf {
        String candidate = it.candidate.version
        String current = it.currentVersion

        if (isNonStable(candidate as String)) {
            return true
        }

        if (!minorPatchOnly) {
            return false
        }

        Integer currentMajor = majorVersion(current as String) as Integer
        Integer candidateMajor = majorVersion(candidate as String) as Integer
        return currentMajor != null && candidateMajor != null && candidateMajor > currentMajor
    }
}
