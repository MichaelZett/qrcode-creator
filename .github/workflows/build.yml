name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-sonar:
    name: Test & SonarCloud
    runs-on: ubuntu-latest
    env:
      # Job-Ebene: nur dort ist das Secret im `if` der Steps sichtbar
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar braucht die volle Historie
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: ./gradlew build
      - name: SonarCloud
        # Secrets sind bei Fork-PRs nicht verfügbar
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_snapshot: ${{ steps.v.outputs.is_snapshot }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(sed -n 's/^appVersion=//p' gradle.properties)
          snapshot=false
          [[ "$version" == *-SNAPSHOT ]] && snapshot=true
          release=false
          if [[ "$snapshot" == false && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            release=true
            grep -q "^## ${version} - " CHANGELOG.md || { echo "::error::CHANGELOG.md hat keinen Eintrag '## ${version} - <Datum>'"; exit 1; }
          fi
          {
            echo "version=$version"
            echo "is_snapshot=$snapshot"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Paket (${{ matrix.name }})
    needs: [test-and-sonar, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: App-Image mit jpackage bauen
        shell: bash
        run: ./gradlew appImage
      - name: Zippen
        if: needs.version.outputs.release == 'true'
        shell: bash
        run: |
          cd build/app-image
          7z a -tzip "../../qr-creator-${{ matrix.name }}.zip" ./*
      - name: ZIP für das Release bereitstellen
        if: needs.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: qr-creator-${{ matrix.name }}
          path: qr-creator-${{ matrix.name }}.zip
          retention-days: 1
          compression-level: 0 # ZIP ist bereits komprimiert

  release:
    name: GitHub Release
    # Nur für Nicht-SNAPSHOT-Versionen per Push auf main
    if: needs.version.outputs.release == 'true' && needs.package.result == 'success'
    needs: [package, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release-Notes aus CHANGELOG.md
        run: |
          awk -v h="## ${VERSION} - " 'index($0,h)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::Leerer CHANGELOG-Abschnitt für ${VERSION}"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: QR-Creator ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*.zip

  bump:
    name: Nächste SNAPSHOT-Version
    needs: [release, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: appVersion hochzählen
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          next="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          sed -i "s/^appVersion=.*/appVersion=${next}/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Start ${next} [skip ci]"
          git push origin main
