name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-sonar:
    name: Test & SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar braucht die volle Historie
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew build
      - name: SonarCloud
        # Secrets sind bei Fork-PRs nicht verfügbar
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  package:
    name: Paket (${{ matrix.name }})
    needs: test-and-sonar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: App-Image mit jpackage bauen
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then ARG="-PreleaseVersion=$VERSION"; else ARG=""; fi
          ./gradlew appImage $ARG
      - name: Zippen
        shell: bash
        run: |
          cd build/app-image
          7z a -tzip "../../qr-creator-${{ matrix.name }}.zip" ./*
      - uses: actions/upload-artifact@v4
        with:
          name: qr-creator-${{ matrix.name }}
          path: qr-creator-${{ matrix.name }}.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
