# CodeQL scans the code for security problems that a compiler and SonarCloud do not see. QR-Creator reads images
# from untrusted sources and writes files, so that is worth having; for a public repository it is free.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 05:00. The queries improve over time: code that was clean last month can be flagged today without
    # anyone touching it.
    - cron: '0 5 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
      # Manual instead of autobuild: CodeQL only needs the compiled classes. Without the build cache, because CodeQL
      # reads the code by watching javac -- a push that leaves the sources alone would otherwise take every class
      # from the cache and the run fails with nothing seen.
      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon --no-build-cache
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
