# CodeQL scans the code for security problems that a compiler and SonarCloud do not see. QR-Creator reads images
# from untrusted sources and writes files, so that is worth having; for a public repository it is free.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 05:00. The queries improve over time: code that was clean last month can be flagged today without
    # anyone touching it.
    - cron: '0 5 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
      # Manual instead of autobuild: CodeQL only needs the compiled classes. Without the build cache, because CodeQL
      # reads the code by watching javac -- a push that leaves the sources alone would otherwise take every class
      # from the cache and the run fails with nothing seen.
      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon --no-build-cache
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
